name: Preusmjeravanje

# Aplikacija je preseljena na Vercel (sah-app.vercel.app).
# GitHub Pages sad samo preusmjerava staru adresu na novu.
on:
  push:
    branches: [main]
    paths:
      - "preusmjeri/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preusmjeri
      - id: deploy
        uses: actions/deploy-pages@v4
