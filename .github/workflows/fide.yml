name: FIDE lista

# Svaki dan skine službenu FIDE listu i spremi hrvatske igrače u fide/cro.json.
# Aplikacija na Vercelu čita tu datoteku, jer ratings.fide.com ne odgovara Vercelovim serverima.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fide-lista.mjs"
      - ".github/workflows/fide.yml"

permissions:
  contents: write

concurrency:
  group: fide-lista
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skini FIDE listu
        run: |
          curl -fsSL --retry 3 --max-time 300 -A "Mozilla/5.0 (sah-app)" -o lista.zip https://ratings.fide.com/download/players_list.zip
          unzip -o -q lista.zip -d lista
          ls -la lista

      - name: Izdvoji hrvatske igrače
        run: node scripts/fide-lista.mjs lista/players_list_foa.txt fide/cro.json

      - name: Spremi ako se promijenilo
        run: |
          git config user.name "sah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fide/cro.json
          # Datum preuzimanja se mijenja svaki dan; spremi samo kad se promijene igrači
          if git diff --cached --quiet -- fide/cro.json; then echo "Nema promjena."; exit 0; fi
          if [ -n "$(git show HEAD:fide/cro.json 2>/dev/null)" ] && [ "$(git show HEAD:fide/cro.json | sed 's/"preuzeto":"[^"]*",//')" = "$(sed 's/"preuzeto":"[^"]*",//' fide/cro.json)" ]; then echo "Ista lista."; exit 0; fi
          git commit -m "FIDE lista $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
