<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šah – turniri i igrači</title>
<meta name="description" content="Šahovski turniri u Hrvatskoj po dobnim skupinama i praćenje igrača.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192024" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Šah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first single column, sticky header + fixed bottom tab bar (Turniri / Igrači) */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #15191d;
  --muted: #5d6871;
  --line: #d9dfe3;
  --accent: #0e6655;
  --accent-soft: #d8ece7;
  --live: #b4321f;
  --live-soft: #f6e0dc;
  --chip: #e3e8eb;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101416; --surface: #192024; --ink: #e8edef; --muted: #96a3ab; --line: #2a3439;
    --accent: #4fc2a8; --accent-soft: #173a33; --live: #f07a62; --live-soft: #3d221d; --chip: #232c31;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; }

.search { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.search:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 500 13px var(--font-body); padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; background: var(--chip); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chip.tc[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

main { padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 18px; }
.month h2 { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.list { display: flex; flex-direction: column; gap: 8px; }

.t { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 12px; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); color: inherit; text-decoration: none; }
.t:hover { border-color: var(--accent); }
.t.past { opacity: 0.6; }
.date { text-align: center; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
.date b { font-family: var(--font-display); font-size: 24px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.date small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.t-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.t-name { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.t-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 500 12px var(--font-body); padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--ink); }
.tag.age { background: var(--accent-soft); color: var(--accent); }
.tag.live { background: var(--live-soft); color: var(--live); }
.tag.mono { font-family: var(--font-mono); font-size: 11.5px; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.note a { color: var(--accent); }


.p { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
.p-name { font: 700 19px var(--font-display); margin: 0; overflow-wrap: anywhere; }
.p-sub { font-size: 13px; color: var(--muted); }
.ratings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.r { background: var(--bg); border-radius: 8px; padding: 8px; text-align: center; }
.r small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.r b { font: 500 20px var(--font-mono); font-variant-numeric: tabular-nums; }
.r i { display: block; font: normal 11.5px var(--font-mono); }
.up { color: var(--accent); } .down { color: var(--live); }
.p h3 { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 0; }
.mini { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.mini li { display: flex; justify-content: space-between; gap: 10px; }
.mini li a { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.mini li span { color: var(--muted); font-family: var(--font-mono); font-size: 12px; flex: none; text-align: right; }
.links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.links a { color: var(--accent); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
nav.tabs button { font: 600 13px var(--font-body); background: none; border: 0; color: var(--muted); padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }
nav.tabs button span { font-size: 22px; line-height: 1.1; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .t, .chip { transition: border-color .15s, background .15s; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>Šah<span>.</span></h1>
      <div class="sync" id="sync">Učitavam…</div>
    </div>
    <div id="tFilters">
      <input class="search" id="q" type="search" placeholder="Traži turnir, grad, klub…" autocomplete="off">
    </div>
    <div class="chips" id="ageChips" role="group" aria-label="Dobna skupina"></div>
    <div class="chips" id="tcChips" role="group" aria-label="Tempo igre"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="vTurniri"></section>
  <section class="view" id="vIgraci" hidden>
    <div class="list" id="players"></div>
  </section>
</main>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" id="tabT" aria-selected="true"><span>♜</span>Turniri</button>
    <button role="tab" id="tabP" aria-selected="false"><span>♚</span>Igrači</button>
  </div>
</nav>

<script>
const AGES = [
  ["sve", "Svi"], ["mladi", "Mladi (sve)"], ["U8", "U8"], ["U10", "U10"], ["U12", "U12"], ["U14", "U14"],
  ["U16", "U16"], ["U18", "U18"], ["U20", "U20"], ["skole", "Škole"], ["zene", "Žene"], ["seniori", "Seniori"], ["open", "Open"]
];
const TCS = [["sve", "Svi tempi"], ["standard", "♚ Standardni"], ["rapid", "♞ Ubrzani"], ["blitz", "♟ Brzopotezni"]];
const TC_LABEL = { standard: "Standardni", rapid: "Ubrzani", blitz: "Brzopotezni" };
const GROUP_LABEL = { kadeti: "Kadeti", skole: "Škole", zene: "Žene", seniori: "Seniori", mladi: "Mladi" };
const MONTHS = ["siječanj", "veljača", "ožujak", "travanj", "svibanj", "lipanj", "srpanj", "kolovoz", "rujan", "listopad", "studeni", "prosinac"];
const DAYS = ["ned", "pon", "uto", "sri", "čet", "pet", "sub"];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
store.set("sah.token", null);  // ključ iz ranije verzije više ne treba
const state = {
  tab: store.get("sah.tab", "t"),
  age: store.get("sah.age", "sve"),
  tc: store.get("sah.tc", "sve"),
  q: "",
  data: store.get("sah.data", null),
  error: null
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${+d}. ${+m}. ${y}.`; };
const fmtStamp = (iso) => new Date(iso).toLocaleString("hr-HR", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });

// ---------- podaci (GitHub ih osvježava svaki sat) ----------

async function loadData() {
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    state.data = await res.json();
    state.error = null;
    store.set("sah.data", state.data);
  } catch {
    state.error = "Podaci se trenutno ne mogu učitati.";
  }
  renderAll();
}

// ---------- prikaz ----------

function statusOf(t) {
  const now = today();
  if (t.to && t.to < now) return "past";
  if (t.from && t.from <= now && (!t.to || t.to >= now)) return "live";
  return "next";
}

function chips(el, items, key, cls) {
  el.innerHTML = items.map(([v, l]) => `<button class="chip ${cls}" data-v="${v}" aria-pressed="${state[key] === v}">${esc(l)}</button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v; store.set("sah." + key, state[key]);
    chips(el, items, key, cls); renderTournaments();
  };
}

function matchAge(t) {
  const g = t.groups || [];
  if (state.age === "sve") return true;
  if (state.age === "mladi") return g.some((x) => /^U\d+$/.test(x) || ["kadeti", "skole", "mladi"].includes(x));
  if (["U8", "U10", "U12", "U14"].includes(state.age)) return g.includes(state.age) || (g.includes("kadeti") && !g.some((x) => /^U\d+$/.test(x)));
  return g.includes(state.age);
}

const playersList = () => (state.data && state.data.players) || [];

function renderTournaments() {
  const el = $("vTurniri");
  if (!state.data) { el.innerHTML = `<div class="empty">${esc(state.error || "Učitavam turnire…")}</div>`; return; }
  const q = state.q.trim().toLowerCase();
  const rows = (state.data.tournaments || [])
    .filter((t) => matchAge(t) && (state.tc === "sve" || t.kind === state.tc))
    .filter((t) => !q || [t.name, t.place, t.organizer].join(" ").toLowerCase().includes(q))
    .filter((t) => statusOf(t) !== "past" || (t.to && t.to >= addDays(today(), -7)))
    .sort((a, b) => (a.from || "9999").localeCompare(b.from || "9999") || a.name.localeCompare(b.name));
  if (!rows.length) { el.innerHTML = `<div class="empty">Nema turnira za odabrane filtre.</div>`; return; }

  const groups = new Map();
  for (const t of rows) {
    const k = (t.from || "").slice(0, 7) || "bez-datuma";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  let html = "";
  for (const [k, list] of groups) {
    const title = k === "bez-datuma" ? "Bez datuma" : `${MONTHS[+k.slice(5) - 1]} ${k.slice(0, 4)}.`;
    html += `<div class="month"><h2>${esc(title)} · ${list.length}</h2><div class="list">${list.map(card).join("")}</div></div>`;
  }
  html += `<p class="note">Izvor: <a href="https://chess-results.com/fed.aspx?lan=1&fed=CRO" target="_blank" rel="noopener">chess-results.com – federacija CRO</a>. Podaci se sami osvježavaju svaki sat od 5 do 22 h. Dodir na turnir otvara njegovu stranicu.</p>`;
  el.innerHTML = html;
}

function card(t) {
  const st = statusOf(t);
  const d = t.from ? new Date(t.from + "T12:00:00Z") : null;
  const multi = t.to && t.from && t.to !== t.from;
  const ages = (t.groups || []).filter((g) => g !== "open").map((g) => GROUP_LABEL[g] || g);
  const tracked = playersList().filter((p) => (p.upcoming || []).some((u) => String(u.tnr) === String(t.tnr)));
  return `<a class="t ${st === "past" ? "past" : ""}" href="${esc(t.url)}" target="_blank" rel="noopener">
    <div class="date">${d ? `<b>${d.getUTCDate()}</b><small>${DAYS[d.getUTCDay()]}</small>` : `<b>–</b>`}</div>
    <div class="t-body">
      <div class="t-name">${esc(t.name)}</div>
      <div class="t-meta">${esc([t.place, multi ? `${fmtDate(t.from)} – ${fmtDate(t.to)}` : ""].filter(Boolean).join(" · "))}</div>
      <div class="tags">
        ${st === "live" ? `<span class="tag live">U tijeku</span>` : ""}
        ${st === "past" ? `<span class="tag">Završen</span>` : ""}
        ${ages.map((a) => `<span class="tag age">${esc(a)}</span>`).join("")}
        ${t.kind ? `<span class="tag">${esc(TC_LABEL[t.kind] || t.kind)}</span>` : ""}
        ${t.tc ? `<span class="tag mono">${esc(t.tc)}</span>` : ""}
        ${t.rounds ? `<span class="tag mono">${t.rounds} kola</span>` : ""}
        ${tracked.map((p) => `<span class="tag live">♚ ${esc(p.name)}</span>`).join("")}
      </div>
    </div>
  </a>`;
}

const delta = (v) => (!v ? `<i>&nbsp;</i>` : `<i class="${v > 0 ? "up" : "down"}">${v > 0 ? "+" : ""}${v}</i>`);

function renderPlayers() {
  const el = $("players");
  if (!state.data) { el.innerHTML = `<div class="empty">${esc(state.error || "Učitavam igrače…")}</div>`; return; }
  const list = playersList();
  if (!list.length) { el.innerHTML = `<div class="empty">Još ne pratiš nijednog igrača.</div>`; return; }
  el.innerHTML = list.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) => {
    const r = p.ratings || {}, d = p.deltas || {};
    return `<article class="p">
      <div>
        <h2 class="p-name">${esc(p.title ? p.title + " " : "")}${esc(p.name)}</h2>
        <div class="p-sub">${esc([p.fideId ? "FIDE " + p.fideId : null, p.birthYear ? "rođ. " + p.birthYear : null, p.federation].filter(Boolean).join(" · ")) || "&nbsp;"}</div>
      </div>
      <div class="ratings">
        <div class="r"><small>Standard</small><b>${r.std || "–"}</b>${delta(d.std)}</div>
        <div class="r"><small>Ubrzani</small><b>${r.rapid || "–"}</b>${delta(d.rapid)}</div>
        <div class="r"><small>Brzopotezni</small><b>${r.blitz || "–"}</b>${delta(d.blitz)}</div>
      </div>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      ${(p.upcoming || []).length ? `<h3>Prijavljen na</h3><ul class="mini">${p.upcoming.map((u) => `<li><a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.name)}</a><span>${esc(fmtDate(u.from))}</span></li>`).join("")}</ul>` : ""}
      ${(p.recent || []).length ? `<h3>Zadnji turniri</h3><ul class="mini">${p.recent.map((u) => `<li><a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.name)}</a><span>${esc(u.result || fmtDate(u.to))}</span></li>`).join("")}</ul>` : ""}
      <div class="links">
        ${p.fideId ? `<a href="https://ratings.fide.com/profile/${encodeURIComponent(p.fideId)}" target="_blank" rel="noopener">FIDE profil</a>` : ""}
        ${p.fideId ? `<a href="https://chessstats.app/player/${encodeURIComponent(p.fideId)}" target="_blank" rel="noopener">Povijest turnira</a>` : ""}
      </div>
    </article>`;
  }).join("");
}

function renderSync() {
  $("sync").textContent = state.data && state.data.updatedAt
    ? `Zadnje osvježeno ${fmtStamp(state.data.updatedAt)}`
    : state.error || "";
}

function renderAll() { renderSync(); renderTournaments(); renderPlayers(); }

function setTab(t) {
  state.tab = t; store.set("sah.tab", t);
  $("tabT").setAttribute("aria-selected", t === "t");
  $("tabP").setAttribute("aria-selected", t === "p");
  $("vTurniri").hidden = t !== "t";
  $("vIgraci").hidden = t !== "p";
  for (const id of ["tFilters", "ageChips", "tcChips"]) $(id).hidden = t !== "t";
  window.scrollTo(0, 0);
}
$("tabT").onclick = () => setTab("t");
$("tabP").onclick = () => setTab("p");
$("q").addEventListener("input", (e) => { state.q = e.target.value; renderTournaments(); });

chips($("ageChips"), AGES, "age", "");
chips($("tcChips"), TCS, "tc", "tc");
if (location.hash === "#igraci") state.tab = "p";
if (location.hash === "#turniri") state.tab = "t";
setTab(state.tab);
renderAll();
loadData();
// Kad se aplikacija ponovno otvori, učitaj najnovije podatke
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });
</script>
</body>
</html>
